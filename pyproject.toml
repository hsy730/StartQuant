[project]
name = "factor-flow"
version = "0.1.0"
description = "因子分析平台 - 基于Web前端的量化因子分析系统"
readme = "README.md"
requires-python = ">=3.10"
packages = ["backend", "utils", "tests"]
dependencies = [
    "akshare>=1.12.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "TA-Lib>=0.4.28",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "xgboost>=2.0.0",
    "plotly>=5.18.0",
    "seaborn>=0.13.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0.0",
    "vectorbt>=0.25.0",
    "DEAP>=1.3.0",
    "pysr>=0.18.0",
    "statsmodels>=0.14.0", # 统计分析（VIF等）
    "shap>=0.42.0", # SHAP模型解释库
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    # 因子相关性分析 - 仅保留核心依赖
    "alphalens-reloaded>=0.4.0",  # 单因子分析行业标准（必须）
]

[project.optional-dependencies]
# 高级功能（按需安装）
advanced = [
    "phik>=0.12.0",  # 混合类型相关性（含分类变量时需要）
]
# 树模型预筛选符号回归（推荐安装）
tree-prescreen = [
    "lightgbm>=4.0.0",  # 树模型特征重要性（比XGBoost更快）
]
# GFlowNet增强遗传规划 + 深度隐式因子模型
deep-learning = [
    "torch>=2.0.0",  # PyTorch（GFlowNet策略网络 + Transformer隐因子）
]
# 全部高级算法
all-algorithms = [
    "lightgbm>=4.0.0",
    "torch>=2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "black>=23.12.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
